<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Papier-Design: der Fuchs hinter dem Kassenbuch als Stempel – grüne Tinte
       auf Blatt, Stempelrahmen innerhalb der sicheren Zone für maskierbare Icons.
       Motiv (Vollstufe) wie in docs/design/logo/mark-full.svg. -->
  <rect width="512" height="512" rx="96" fill="#FBF9F3"/>
  <rect x="58" y="58" width="396" height="396" rx="64" fill="none" stroke="#2F6B4F" stroke-width="18"/>
  <g transform="translate(256 258) scale(3.3) translate(-50 -48.5)">
    <!-- Kopf: Ohren, Stirn, Wangen; die Schnauze läuft hinter dem Blatt zusammen -->
    <path d="M19 9 L40 32 C44 28 56 28 60 32 L81 9 C82 22 78 34 77 42 C74 54 66 66 64 72 L36 72 C34 66 26 54 23 42 C22 34 18 22 19 9 Z" fill="#2F6B4F"/>
    <g fill="#FBF9F3">
      <ellipse cx="37" cy="44.5" rx="3.3" ry="4.3" transform="rotate(-14 37 44.5)"/>
      <ellipse cx="63" cy="44.5" rx="3.3" ry="4.3" transform="rotate(14 63 44.5)"/>
    </g>
    <!-- Blatt mit Eselsohr -->
    <path d="M14 50 H72 L86 64 V88 H14 Z" fill="#FBF9F3" stroke="#2F6B4F" stroke-width="4" stroke-linejoin="round"/>
    <path d="M72 50 V64 H86" fill="none" stroke="#2F6B4F" stroke-width="4" stroke-linejoin="round"/>
    <!-- Kassenbuch: Text links, Betrag rechts, Summe mit Doppelstrich -->
    <g stroke="#2F6B4F" stroke-width="2.6" stroke-linecap="round">
      <line x1="24" y1="63" x2="46" y2="63"/><line x1="60" y1="63" x2="70" y2="63"/>
      <line x1="24" y1="71" x2="50" y2="71"/><line x1="68" y1="71" x2="76" y2="71"/>
      <line x1="24" y1="80" x2="76" y2="80"/><line x1="24" y1="83.5" x2="76" y2="83.5"/>
    </g>
  </g>
</svg>
