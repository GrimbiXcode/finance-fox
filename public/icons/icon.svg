<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Papier-Design: der Fuchs als Stempel – grüne Tinte auf Blatt,
       Stempelrahmen innerhalb der sicheren Zone für maskierbare Icons -->
  <rect width="512" height="512" rx="96" fill="#FBF9F3"/>
  <rect x="58" y="58" width="396" height="396" rx="64" fill="none" stroke="#2F6B4F" stroke-width="18"/>
  <g fill="#2F6B4F">
    <!-- Ohren -->
    <path d="M166 122 L220 200 L142 212 Z"/>
    <path d="M346 122 L292 200 L370 212 Z"/>
    <!-- Kopf -->
    <path d="M256 182
             C 202 182 158 226 158 280
             C 158 330 202 376 256 404
             C 310 376 354 330 354 280
             C 354 226 310 182 256 182 Z"/>
  </g>
  <!-- Augen und Nase in Blattfarbe -->
  <g fill="#FBF9F3">
    <circle cx="218" cy="270" r="14"/>
    <circle cx="294" cy="270" r="14"/>
    <circle cx="256" cy="340" r="11"/>
  </g>
</svg>
