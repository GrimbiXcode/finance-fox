name: Docker-Image bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # ghcr.io verlangt Kleinbuchstaben im Image-Namen
      - name: Image-Name in Kleinbuchstaben umwandeln
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Bei ghcr.io anmelden (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bei Pull Requests ist github.ref_name z. B. "1/merge" — enthält einen
      # Schrägstrich und ist damit als Docker-Tag ungültig.
      - name: Ref-Tag bestimmen
        id: ref_tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image bauen (Push nur bei Tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.ref_tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
